[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "sih26153-network-attack-forecasting"
version = "1.0.0"
description = "AI-Based Network Attack Forecasting — SIH26153"
readme = "docs/ARCHITECTURE.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=integration --cov-report=term-missing"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]

[tool.coverage.run]
source = ["integration"]
omit = ["tests/*", "repos/*"]

[tool.coverage.report]
show_missing = true
fail_under = 40
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# CLI entrypoints insert sys.path before project imports by design.
"run.py" = ["E402"]
"simulate_attack.py" = ["E402"]
"jsonl_to_iptables.py" = ["E402"]
"validate_detection.py" = ["E402"]
"integration/*" = ["E402"]
